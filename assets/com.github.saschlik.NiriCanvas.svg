<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background glow / drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>

    <!-- Monitor 1 Screen Gradient (Deep Blue to Cyan) -->
    <linearGradient id="screenGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Monitor 2 Screen Gradient (Indigo to Violet) -->
    <linearGradient id="screenGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Bezel Metallic Gradients -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Canvas App Base Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0f172a" filter="url(#shadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Subtle Grid lines on Canvas -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="24" y1="20" x2="24" y2="108"/>
    <line x1="48" y1="20" x2="48" y2="108"/>
    <line x1="72" y1="20" x2="72" y2="108"/>
    <line x1="96" y1="20" x2="96" y2="108"/>
    <line x1="20" y1="36" x2="108" y2="36"/>
    <line x1="20" y1="64" x2="108" y2="64"/>
    <line x1="20" y1="92" x2="108" y2="92"/>
  </g>

  <!-- Connecting Alignment Dash (Magnetic Snap Representation) -->
  <line x1="64" y1="26" x2="64" y2="96" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" filter="url(#cyanGlow)" stroke-opacity="0.9"/>

  <!-- Left Monitor (Primary - Landscape 16:9) -->
  <g filter="url(#shadow)">
    <!-- Stand -->
    <rect x="36" y="80" width="8" height="10" rx="1" fill="#475569"/>
    <ellipse cx="40" cy="91" rx="14" ry="3" fill="#334155"/>
    <!-- Outer Bezel -->
    <rect x="18" y="34" width="44" height="48" rx="5" fill="url(#bezelGrad)" stroke="#475569" stroke-width="1.2"/>
    <!-- Screen -->
    <rect x="21" y="37" width="38" height="42" rx="3" fill="url(#screenGrad1)"/>
    <!-- Badge: "1" -->
    <circle cx="27" cy="43" r="4.5" fill="#0369a1"/>
    <text x="27" y="46" font-family="sans-serif" font-weight="bold" font-size="6" fill="#ffffff" text-anchor="middle">1</text>
    <!-- Primary Star -->
    <polygon points="53,40 54.5,43.5 58,43.5 55,45.5 56.2,49 53,47 49.8,49 51,45.5 48,43.5 51.5,43.5" fill="#fbbf24"/>
  </g>

  <!-- Right Monitor (Secondary - Vertical / Portrait) -->
  <g filter="url(#shadow)">
    <!-- Stand -->
    <rect x="84" y="86" width="8" height="8" rx="1" fill="#475569"/>
    <ellipse cx="88" cy="95" rx="12" ry="3" fill="#334155"/>
    <!-- Outer Bezel -->
    <rect x="66" y="24" width="44" height="64" rx="5" fill="url(#bezelGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cyanGlow)"/>
    <!-- Screen -->
    <rect x="69" y="27" width="38" height="58" rx="3" fill="url(#screenGrad2)"/>
    <!-- Badge: "2" -->
    <circle cx="75" cy="33" r="4.5" fill="#4338ca"/>
    <text x="75" y="36" font-family="sans-serif" font-weight="bold" font-size="6" fill="#ffffff" text-anchor="middle">2</text>
  </g>
</svg>
